services:
  - type: web
    name: todolist-projeto-2
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: bash render-build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_EXPORT
        value: "1"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
