# Persistência agora é o Google BigQuery (não usamos mais o PostgreSQL do Render).
# Configure GOOGLE_APPLICATION_CREDENTIALS_JSON no painel do Render (aba Environment)
# com o JSON do service account (puro ou base64). Veja RENDER_SETUP.md.

services:
  - type: web
    name: todolist-projeto-2
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: bash render-build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_EXPORT
        value: "1"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: USE_BIGQUERY
        value: "1"
      - key: BQ_DATASET
        value: todolist
      - key: BQ_LOCATION
        value: US
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
