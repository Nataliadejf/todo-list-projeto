name: CI e build de produção

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependências da API
        run: npm ci

      - name: Build do frontend (Next.js export)
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NPM_CONFIG_PRODUCTION: "false"

      - name: Verificar artefato estático
        run: test -f web/out/index.html
